<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoupPro Board Review</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;display:flex;height:100vh;overflow:hidden;background:#f0f0f0}
#sidebar{width:272px;min-width:272px;background:#1e1e2e;color:#cdd6f4;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:7px}
#sidebar h1{font-size:13px;text-align:center;color:#cba6f7;padding:6px 0;border-bottom:1px solid #45475a;margin-bottom:2px}
.sec{background:#313244;border-radius:7px;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.sec h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#89b4fa;margin-bottom:1px}
.row{display:flex;align-items:center;justify-content:space-between;gap:5px;font-size:11px}
.row label{flex:1;color:#bac2de;min-width:80px}
.row input[type=color]{width:34px;height:22px;border:none;border-radius:3px;cursor:pointer;padding:0;background:none}
.row input[type=range]{flex:1;accent-color:#89b4fa;min-width:0}
.row input[type=checkbox]{width:15px;height:15px;accent-color:#89b4fa;cursor:pointer;flex-shrink:0}
.row span.val{width:38px;text-align:right;font-size:10px;color:#a6adc8;flex-shrink:0}
.row select{flex:1;background:#45475a;color:#cdd6f4;border:none;border-radius:4px;padding:2px 4px;font-size:11px}
.btn-row{display:flex;gap:7px;margin-top:2px}
.btn{flex:1;padding:6px 4px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-p{background:#89b4fa;color:#1e1e2e}
.btn-s{background:#45475a;color:#cdd6f4}
.btn:hover{opacity:.82}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .3s;overflow:auto;padding:20px}
#brd{display:block;max-width:100%;max-height:90vh}
#bl{margin-top:10px;font-size:12px;color:#555;text-align:center}
</style>
</head>
<body>
<div id="sidebar">
  <h1>CoupPro Board Review</h1>

  <div class="sec">
    <h2>Board Background</h2>
    <div class="row"><label>Color</label><input type="color" id="bc" value="#f5deb3" oninput="db()"></div>
    <div class="row"><label>Wood Texture</label><input type="checkbox" id="wt" onchange="db()"></div>
    <div class="row"><label>Dark Mode</label><input type="checkbox" id="dm" onchange="db()"></div>
  </div>

  <div class="sec">
    <h2>Grid Lines</h2>
    <div class="row"><label>Color</label><input type="color" id="lc" value="#8b5a2b" oninput="db()"></div>
    <div class="row"><label>Opacity</label><input type="range" id="lo" min="10" max="100" value="40" oninput="sv('lv',this.value+'%');db()"><span class="val" id="lv">40%</span></div>
    <div class="row"><label>Thickness</label><input type="range" id="lt" min="5" max="30" value="10" oninput="sv('ltv',(this.value/10).toFixed(1)+'px');db()"><span class="val" id="ltv">1.0px</span></div>
  </div>

  <div class="sec">
    <h2>Board Frame</h2>
    <div class="row"><label>Show Frame</label><input type="checkbox" id="sf" checked onchange="db()"></div>
    <div class="row"><label>Frame Color</label><input type="color" id="fc" value="#8b6914" oninput="db()"></div>
    <div class="row"><label>Frame Width</label><input type="range" id="fw" min="2" max="20" value="8" oninput="sv('fwv',this.value+'px');db()"><span class="val" id="fwv">8px</span></div>
  </div>

  <div class="sec">
    <h2>River Text</h2>
    <div class="row"><label>Show Text</label><input type="checkbox" id="rt" checked onchange="db()"></div>
    <div class="row"><label>Color</label><input type="color" id="rc2" value="#8b5a2b" oninput="db()"></div>
    <div class="row"><label>Opacity</label><input type="range" id="ro" min="10" max="100" value="40" oninput="sv('rov',this.value+'%');db()"><span class="val" id="rov">40%</span></div>
    <div class="row"><label>Font Size</label><input type="range" id="rfs" min="8" max="22" value="13" oninput="sv('rfsv',this.value+'px');db()"><span class="val" id="rfsv">13px</span></div>
  </div>

  <div class="sec">
    <h2>Hidden Pieces (Rim)</h2>
    <div class="row"><label>Side Color Rim</label><input type="checkbox" id="sr" checked onchange="db()"></div>
    <div class="row"><label>Red Rim</label><input type="color" id="rrc" value="#c0392b" oninput="db()"></div>
    <div class="row"><label>Black Rim</label><input type="color" id="brc" value="#222222" oninput="db()"></div>
    <div class="row"><label>Rim Width</label><input type="range" id="rw" min="1" max="8" value="3" oninput="sv('rwv',this.value+'px');db()"><span class="val" id="rwv">3px</span></div>
    <div class="row"><label>Show ? Mark</label><input type="checkbox" id="qm" checked onchange="db()"></div>
  </div>

  <div class="sec">
    <h2>Highlights</h2>
    <div class="row"><label>Last Move</label><input type="checkbox" id="lm" checked onchange="db()"></div>
    <div class="row"><label>Valid Moves</label><input type="checkbox" id="vm" checked onchange="db()"></div>
    <div class="row"><label>Selected Glow</label><input type="checkbox" id="sg" checked onchange="db()"></div>
  </div>

  <div class="sec">
    <h2>Piece Size</h2>
    <div class="row"><label>Outer R</label><input type="range" id="outerR" min="12" max="28" value="22" oninput="sv('orv',this.value+'px');db()"><span class="val" id="orv">22px</span></div>
    <div class="row"><label>Inner R</label><input type="range" id="innerR" min="8" max="24" value="18" oninput="sv('irv',this.value+'px');db()"><span class="val" id="irv">18px</span></div>
  </div>

  <div class="sec">
    <h2>Page BG</h2>
    <div class="row"><label>Style</label>
      <select id="pb" onchange="db()">
        <option value="g">Gray</option>
        <option value="d">Dark</option>
        <option value="r">Radial Gold</option>
        <option value="b">Bamboo Green</option>
      </select>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-p" onclick="rst()">Reset</button>
    <button class="btn btn-s" onclick="cpCfg()">Copy Config</button>
  </div>
</div>
<div id="main">
  <svg id="brd" xmlns="http://www.w3.org/2000/svg" width="580" height="646" style="border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.25)"></svg>
  <div id="bl">CoupPro Board Preview &mdash; <b id="cl" style="color:#e94560">Default</b></div>
</div>
<script>
var SZ=60,PX=50,PY=53,COLS=9,ROWS=10,W=580,H=646;
function gv(id){return document.getElementById(id);}
function sv(id,v){var e=gv(id);if(e)e.textContent=v;}
function px(c){return PX+c*SZ;}
function py2(r){return PY+r*SZ;}
function h2a(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
var PIECES=[
  {r:0,c:0,col:'b',up:false},{r:0,c:1,col:'b',up:false},{r:0,c:2,col:'b',up:false},
  {r:0,c:3,col:'b',up:false},{r:0,c:4,col:'b',up:true,nm:'\u5c06'},
  {r:0,c:5,col:'b',up:false},{r:0,c:6,col:'b',up:false},{r:0,c:7,col:'b',up:false},
  {r:0,c:8,col:'b',up:false},
  {r:9,c:0,col:'r',up:false},{r:9,c:1,col:'r',up:false},{r:9,c:2,col:'r',up:false},
  {r:9,c:3,col:'r',up:false},{r:9,c:4,col:'r',up:true,nm:'\u5e25'},
  {r:9,c:5,col:'r',up:false},{r:9,c:6,col:'r',up:false},{r:9,c:7,col:'r',up:false},
  {r:9,c:8,col:'r',up:false},
  {r:5,c:2,col:'r',up:true,nm:'\u8eca'},
  {r:4,c:4,col:'b',up:true,nm:'\u99ac'},
  {r:5,c:6,col:'r',up:true,nm:'\u70ae'},
  {r:4,c:2,col:'b',up:true,nm:'\u76f8'}
];
var SEL={r:9,c:4};
var LMF={r:8,c:3},LMT={r:7,c:3};
var VM=[{r:8,c:4},{r:9,c:3},{r:9,c:5}];

function db(){
  var svg=gv('brd');
  var bc=gv('bc').value;
  var wt=gv('wt').checked;
  var dm=gv('dm').checked;
  var lc=gv('lc').value;
  var lo=parseInt(gv('lo').value)/100;
  var lt=parseFloat(gv('lt').value)/10;
  var sf=gv('sf').checked;
  var fc=gv('fc').value;
  var fw=parseInt(gv('fw').value);
  var rtOn=gv('rt').checked;
  var rc2=gv('rc2').value;
  var ro=parseInt(gv('ro').value)/100;
  var rfs=parseInt(gv('rfs').value);
  var sr=gv('sr').checked;
  var rrc=gv('rrc').value;
  var brc=gv('brc').value;
  var rw=parseInt(gv('rw').value);
  var qm=gv('qm').checked;
  var lmOn=gv('lm').checked;
  var vmOn=gv('vm').checked;
  var sgOn=gv('sg').checked;
  var outerR=parseInt(gv('outerR').value);
  var innerR=parseInt(gv('innerR').value);
  var pb=gv('pb').value;

  var boardBg=dm?'#2c1810':bc;
  var lineCol=h2a(lc,lo);
  var riverCol=h2a(rc2,ro);
  var mainEl=gv('main');
  if(pb==='g')mainEl.style.background='#f0f0f0';
  else if(pb==='d')mainEl.style.background='#1a1a2e';
  else if(pb==='r')mainEl.style.background='radial-gradient(ellipse at center,#e8d5a3 0%,#b8860b 50%,#3d2b00 100%)';
  else if(pb==='b')mainEl.style.background='linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 40%,#81c784 100%)';

  var o='';
  o+='<defs>';
  o+='<radialGradient id="rg_r" cx="38%" cy="32%" r="65%">';
  o+='<stop offset="0%" stop-color="#e8c060"/>';
  o+='<stop offset="50%" stop-color="#a06828"/>';
  o+='<stop offset="100%" stop-color="#3d2000"/>';
  o+='</radialGradient>';
  o+='<radialGradient id="rg_b" cx="38%" cy="32%" r="65%">';
  o+='<stop offset="0%" stop-color="#606060"/>';
  o+='<stop offset="50%" stop-color="#282828"/>';
  o+='<stop offset="100%" stop-color="#000000"/>';
  o+='</radialGradient>';
  o+='</defs>';

  o+='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="6" fill="'+boardBg+'"/>';

  if(sf){
    var fh=fw/2;
    var fx=PX-SZ/2+fh, fy=PY-SZ/2+fh;
    var fw2=(COLS-1)*SZ+SZ-fw, fh2=(ROWS-1)*SZ+SZ-fw;
    o+='<rect x="'+fx+'" y="'+fy+'" width="'+fw2+'" height="'+fh2+'" rx="4" fill="none" stroke="'+fc+'" stroke-width="'+fw+'"/>';
  }

  if(lmOn){
    var lmfx=px(LMF.c)-SZ/2, lmfy=py2(LMF.r)-SZ/2;
    var lmtx=px(LMT.c)-SZ/2, lmty=py2(LMT.r)-SZ/2;
    o+='<rect x="'+lmfx+'" y="'+lmfy+'" width="'+SZ+'" height="'+SZ+'" fill="rgba(255,210,0,0.32)" rx="3"/>';
    o+='<rect x="'+lmtx+'" y="'+lmty+'" width="'+SZ+'" height="'+SZ+'" fill="rgba(255,210,0,0.32)" rx="3"/>';
  }

  o+='<g stroke="'+lineCol+'" stroke-width="'+lt+'" stroke-linecap="round">';
  for(var r=0;r<ROWS;r++){
    o+='<line x1="'+px(0)+'" y1="'+py2(r)+'" x2="'+px(8)+'" y2="'+py2(r)+'"/>';
  }
  for(var c=0;c<COLS;c++){
    if(c===0||c===8){
      o+='<line x1="'+px(c)+'" y1="'+py2(0)+'" x2="'+px(c)+'" y2="'+py2(9)+'"/>';
    } else {
      o+='<line x1="'+px(c)+'" y1="'+py2(0)+'" x2="'+px(c)+'" y2="'+py2(4)+'"/>';
      o+='<line x1="'+px(c)+'" y1="'+py2(5)+'" x2="'+px(c)+'" y2="'+py2(9)+'"/>';
    }
  }
  var dx=SZ*0.5,dy=SZ*0.5;
  o+='<line x1="'+px(3)+'" y1="'+py2(0)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(0)+dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(0)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(0)+dy)+'"/>';
  o+='<line x1="'+px(3)+'" y1="'+py2(2)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(2)-dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(2)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(2)-dy)+'"/>';
  o+='<line x1="'+px(3)+'" y1="'+py2(7)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(7)+dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(7)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(7)+dy)+'"/>';
  o+='<line x1="'+px(3)+'" y1="'+py2(9)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(9)-dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(9)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(9)-dy)+'"/>';
  o+='</g>';

  if(rtOn){
    var ry=(py2(4)+py2(5))/2;
    o+='<text x="'+(W/2-40)+'" y="'+ry+'" text-anchor="middle" dominant-baseline="middle"';
    o+=' font-size="'+rfs+'" fill="'+riverCol+'" font-family="serif" letter-spacing="8">\u695a\u6cb3</text>';
    o+='<text x="'+(W/2+40)+'" y="'+ry+'" text-anchor="middle" dominant-baseline="middle"';
    o+=' font-size="'+rfs+'" fill="'+riverCol+'" font-family="serif" letter-spacing="8">\u6f22\u754c</text>';
  }

  if(vmOn){
    for(var i=0;i<VM.length;i++){
      o+='<circle cx="'+px(VM[i].c)+'" cy="'+py2(VM[i].r)+'" r="9" fill="rgba(80,200,80,0.6)"/>';
    }
  }

  for(var pi=0;pi<PIECES.length;pi++){
    var p=PIECES[pi];
    var cx=px(p.c), cy=py2(p.r);
    var isSel=(SEL&&SEL.r===p.r&&SEL.c===p.c);
    var grad=p.col==='r'?'url(#rg_r)':'url(#rg_b)';
    var rimCol=p.col==='r'?rrc:brc;

    if(sgOn&&isSel){
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(outerR+5)+'" fill="rgba(255,255,80,0.35)"/>';
    }
    if(sr&&!p.up){
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+outerR+'" fill="'+rimCol+'"/>';
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(outerR-rw)+'" fill="'+grad+'"/>';
    } else {
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+outerR+'" fill="'+grad+'"/>';
    }
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+innerR+'" fill="none" stroke="rgba(255,210,0,0.55)" stroke-width="1.5"/>';
    if(p.up&&p.nm){
      var tc=p.col==='r'?'#f8e17a':'#e0e0e0';
      o+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central"';
      o+=' font-size="'+(outerR*0.85)+'" font-family="serif" font-weight="bold" fill="'+tc+'" stroke="rgba(0,0,0,0.4)" stroke-width="0.4">';
      o+=p.nm+'</text>';
    } else if(!p.up&&qm){
      o+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central"';
      o+=' font-size="'+(outerR*0.75)+'" font-family="serif" fill="rgba(255,255,255,0.65)">?</text>';
    }
  }

  svg.innerHTML=o;

  var lbl=gv('cl');
  var parts=[];
  if(sf)parts.push('Frame');
  if(wt)parts.push('Wood');
  if(dm)parts.push('Dark');
  if(sr)parts.push('Rim');
  if(lmOn)parts.push('LastMove');
  if(vmOn)parts.push('ValidMoves');
  lbl.textContent=parts.length?parts.join('+'):'Default';
}

function rst(){
  gv('bc').value='#f5deb3';gv('wt').checked=false;gv('dm').checked=false;
  gv('lc').value='#8b5a2b';gv('lo').value=40;sv('lv','40%');
  gv('lt').value=10;sv('ltv','1.0px');
  gv('sf').checked=true;gv('fc').value='#8b6914';gv('fw').value=8;sv('fwv','8px');
  gv('rt').checked=true;gv('rc2').value='#8b5a2b';gv('ro').value=40;sv('rov','40%');
  gv('rfs').value=13;sv('rfsv','13px');
  gv('sr').checked=true;gv('rrc').value='#c0392b';gv('brc').value='#222222';
  gv('rw').value=3;sv('rwv','3px');gv('qm').checked=true;
  gv('lm').checked=true;gv('vm').checked=true;gv('sg').checked=true;
  gv('outerR').value=22;sv('orv','22px');gv('innerR').value=18;sv('irv','18px');
  gv('pb').value='g';
  db();
}

function cpCfg(){
  var cfg={
    boardColor:gv('bc').value,woodTexture:gv('wt').checked,darkMode:gv('dm').checked,
    lineColor:gv('lc').value,lineOpacity:+gv('lo').value,lineThickness:+(gv('lt').value/10).toFixed(1),
    showFrame:gv('sf').checked,frameColor:gv('fc').value,frameWidth:+gv('fw').value,
    showRiverText:gv('rt').checked,riverColor:gv('rc2').value,riverOpacity:+gv('ro').value,riverFontSize:+gv('rfs').value,
    sideRim:gv('sr').checked,redRimColor:gv('rrc').value,blackRimColor:gv('brc').value,rimWidth:+gv('rw').value,showQuestion:gv('qm').checked,
    lastMove:gv('lm').checked,validMoves:gv('vm').checked,selectedGlow:gv('sg').checked,
    outerRadius:+gv('outerR').value,innerRadius:+gv('innerR').value,pageBg:gv('pb').value
  };
  navigator.clipboard.writeText(JSON.stringify(cfg,null,2)).then(function(){alert('Config copied!');});
}
window.onload=function(){db();};
</script></body></html>

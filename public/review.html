<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoupPro Board Review</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;display:flex;height:100vh;overflow:hidden;background:#f0f0f0}
#sidebar{width:278px;min-width:278px;background:#1e1e2e;color:#cdd6f4;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
#sidebar h1{font-size:13px;text-align:center;color:#cba6f7;padding:5px 0;border-bottom:1px solid #45475a;margin-bottom:2px}
.sec{background:#313244;border-radius:7px;padding:7px 9px;display:flex;flex-direction:column;gap:5px}
.sec h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#89b4fa;margin-bottom:1px}
.row{display:flex;align-items:center;gap:5px;font-size:11px;min-height:22px}
.row label{width:88px;flex-shrink:0;color:#bac2de;font-size:11px}
.row input[type=color]{width:34px;height:21px;border:none;border-radius:3px;cursor:pointer;padding:0;background:none;flex-shrink:0}
.row input[type=range]{flex:1;accent-color:#89b4fa;min-width:0}
.row input[type=checkbox]{width:15px;height:15px;accent-color:#89b4fa;cursor:pointer;flex-shrink:0}
.row input[type=text]{flex:1;background:#45475a;color:#cdd6f4;border:none;border-radius:4px;padding:2px 5px;font-size:11px;font-family:serif}
.row span.val{width:36px;text-align:right;font-size:10px;color:#a6adc8;flex-shrink:0}
.row select{flex:1;background:#45475a;color:#cdd6f4;border:none;border-radius:4px;padding:2px 4px;font-size:11px}
.btn-row{display:flex;gap:7px;margin-top:2px}
.btn{flex:1;padding:6px 4px;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-p{background:#89b4fa;color:#1e1e2e}
.btn-s{background:#45475a;color:#cdd6f4}
.btn:hover{opacity:.82}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .3s;overflow:auto;padding:16px}
#brd{display:block;max-width:100%;max-height:calc(100vh - 60px)}
#bl{margin-top:8px;font-size:12px;color:#555;text-align:center}
</style>
</head>
<body>
<div id="sidebar">
  <h1>Board Review — Full Control</h1>

  <div class="sec">
    <h2>Board Background</h2>
    <div class="row"><label>Color</label><input type="color" id="bc" value="#f5deb3" oninput="db()"></div>
    <div class="row"><label>Dark Mode</label><input type="checkbox" id="dm" onchange="db()"></div>
  </div>

  <div class="sec">
    <h2>Grid Lines</h2>
    <div class="row"><label>Color</label><input type="color" id="lc" value="#8b5a2b" oninput="db()"></div>
    <div class="row"><label>Opacity %</label><input type="range" id="lo" min="5" max="100" value="40" oninput="sv('lv',this.value+'%');db()"><span class="val" id="lv">40%</span></div>
    <div class="row"><label>Thickness</label><input type="range" id="lt" min="5" max="30" value="10" oninput="sv('ltv',(this.value/10).toFixed(1)+'px');db()"><span class="val" id="ltv">1.0px</span></div>
  </div>

  <div class="sec">
    <h2>Board Frame</h2>
    <div class="row"><label>Show</label><input type="checkbox" id="sf" checked onchange="db()"></div>
    <div class="row"><label>Color</label><input type="color" id="fc" value="#8b6914" oninput="db()"></div>
    <div class="row"><label>Width</label><input type="range" id="fw" min="2" max="20" value="8" oninput="sv('fwv',this.value+'px');db()"><span class="val" id="fwv">8px</span></div>
  </div>

  <div class="sec">
    <h2>River Text (楚河/漢界)</h2>
    <div class="row"><label>Show</label><input type="checkbox" id="rt" checked onchange="db()"></div>
    <div class="row"><label>Left text</label><input type="text" id="rtL" value="楚河" oninput="db()"></div>
    <div class="row"><label>Right text</label><input type="text" id="rtR" value="漢界" oninput="db()"></div>
    <div class="row"><label>Color</label><input type="color" id="rc2" value="#8b5a2b" oninput="db()"></div>
    <div class="row"><label>Opacity %</label><input type="range" id="ro" min="5" max="100" value="40" oninput="sv('rov',this.value+'%');db()"><span class="val" id="rov">40%</span></div>
    <div class="row"><label>Font size</label><input type="range" id="rfs" min="8" max="24" value="13" oninput="sv('rfsv',this.value+'px');db()"><span class="val" id="rfsv">13px</span></div>
  </div>

  <div class="sec">
    <h2>Red Pieces</h2>
    <div class="row"><label>Grad bright</label><input type="color" id="rp1" value="#e8c060" oninput="db()"></div>
    <div class="row"><label>Grad mid</label><input type="color" id="rp2" value="#a06828" oninput="db()"></div>
    <div class="row"><label>Grad dark</label><input type="color" id="rp3" value="#3d2000" oninput="db()"></div>
    <div class="row"><label>Text color</label><input type="color" id="rtc" value="#f8e17a" oninput="db()"></div>
  </div>

  <div class="sec">
    <h2>Black Pieces</h2>
    <div class="row"><label>Grad bright</label><input type="color" id="bp1" value="#606060" oninput="db()"></div>
    <div class="row"><label>Grad mid</label><input type="color" id="bp2" value="#282828" oninput="db()"></div>
    <div class="row"><label>Grad dark</label><input type="color" id="bp3" value="#000000" oninput="db()"></div>
    <div class="row"><label>Text color</label><input type="color" id="btc" value="#e0e0e0" oninput="db()"></div>
  </div>

  <div class="sec">
    <h2>Inner Ring</h2>
    <div class="row"><label>Color</label><input type="color" id="irc" value="#ffd700" oninput="db()"></div>
    <div class="row"><label>Opacity %</label><input type="range" id="iro" min="10" max="100" value="55" oninput="sv('irov',this.value+'%');db()"><span class="val" id="irov">55%</span></div>
    <div class="row"><label>Thickness</label><input type="range" id="irt" min="5" max="30" value="15" oninput="sv('irtv',(this.value/10).toFixed(1)+'px');db()"><span class="val" id="irtv">1.5px</span></div>
  </div>

  <div class="sec">
    <h2>Hidden Pieces</h2>
    <div class="row"><label>Side rim</label><input type="checkbox" id="sr" checked onchange="db()"></div>
    <div class="row"><label>Red rim</label><input type="color" id="rrc" value="#c0392b" oninput="db()"></div>
    <div class="row"><label>Black rim</label><input type="color" id="brc" value="#222222" oninput="db()"></div>
    <div class="row"><label>Rim width</label><input type="range" id="rw" min="1" max="10" value="3" oninput="sv('rwv',this.value+'px');db()"><span class="val" id="rwv">3px</span></div>
    <div class="row"><label>? mark</label><input type="checkbox" id="qm" checked onchange="db()"></div>
    <div class="row"><label>? color</label><input type="color" id="qc" value="#ffffff" oninput="db()"></div>
    <div class="row"><label>? opacity %</label><input type="range" id="qo" min="10" max="100" value="65" oninput="sv('qov',this.value+'%');db()"><span class="val" id="qov">65%</span></div>
  </div>

  <div class="sec">
    <h2>Highlights</h2>
    <div class="row"><label>Last move</label><input type="checkbox" id="lm" checked onchange="db()"></div>
    <div class="row"><label>LM color</label><input type="color" id="lmc" value="#ffd200" oninput="db()"></div>
    <div class="row"><label>LM opacity %</label><input type="range" id="lmo" min="10" max="80" value="32" oninput="sv('lmov',this.value+'%');db()"><span class="val" id="lmov">32%</span></div>
    <div class="row"><label>Valid moves</label><input type="checkbox" id="vm" checked onchange="db()"></div>
    <div class="row"><label>VM color</label><input type="color" id="vmc" value="#50c850" oninput="db()"></div>
    <div class="row"><label>Selected glow</label><input type="checkbox" id="sg" checked onchange="db()"></div>
    <div class="row"><label>Glow color</label><input type="color" id="sgc" value="#ffff50" oninput="db()"></div>
    <div class="row"><label>Glow opacity %</label><input type="range" id="sgo" min="10" max="80" value="35" oninput="sv('sgov',this.value+'%');db()"><span class="val" id="sgov">35%</span></div>
  </div>

  <div class="sec">
    <h2>Piece Size</h2>
    <div class="row"><label>Outer R</label><input type="range" id="outerR" min="12" max="28" value="22" oninput="sv('orv',this.value+'px');db()"><span class="val" id="orv">22px</span></div>
    <div class="row"><label>Inner R</label><input type="range" id="innerR" min="8" max="26" value="18" oninput="sv('irv',this.value+'px');db()"><span class="val" id="irv">18px</span></div>
  </div>

  <div class="sec">
    <h2>Page Background</h2>
    <div class="row"><label>Style</label>
      <select id="pb" onchange="db()">
        <option value="g">Gray</option>
        <option value="d">Dark Navy</option>
        <option value="r">Radial Gold</option>
        <option value="b">Bamboo Green</option>
        <option value="w">White</option>
      </select>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-p" onclick="rst()">Reset</button>
    <button class="btn btn-s" onclick="cpCfg()">Copy Config</button>
  </div>
</div>
<div id="main">
  <svg id="brd" xmlns="http://www.w3.org/2000/svg" width="580" height="646" style="border-radius:6px;box-shadow:0 4px 24px rgba(0,0,0,0.28)"></svg>
  <div id="bl">CoupPro Board Preview &mdash; <b id="cl" style="color:#e94560">Default</b></div>
</div>
<script>
var SZ=60,PX=50,PY=53,COLS=9,ROWS=10,W=580,H=646;
function gv(id){return document.getElementById(id);}
function gval(id){return gv(id).value;}
function gcb(id){return gv(id).checked;}
function sv(id,v){var e=gv(id);if(e)e.textContent=v;}
function px(c){return PX+c*SZ;}
function py2(r){return PY+r*SZ;}
function h2a(hex,a){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
var PIECES=[
  {r:0,c:0,col:'b',up:false},{r:0,c:1,col:'b',up:false},{r:0,c:2,col:'b',up:false},
  {r:0,c:3,col:'b',up:false},{r:0,c:4,col:'b',up:true,nm:'\u5c06'},
  {r:0,c:5,col:'b',up:false},{r:0,c:6,col:'b',up:false},{r:0,c:7,col:'b',up:false},
  {r:0,c:8,col:'b',up:false},
  {r:9,c:0,col:'r',up:false},{r:9,c:1,col:'r',up:false},{r:9,c:2,col:'r',up:false},
  {r:9,c:3,col:'r',up:false},{r:9,c:4,col:'r',up:true,nm:'\u5e25'},
  {r:9,c:5,col:'r',up:false},{r:9,c:6,col:'r',up:false},{r:9,c:7,col:'r',up:false},
  {r:9,c:8,col:'r',up:false},
  {r:5,c:2,col:'r',up:true,nm:'\u8eca'},
  {r:4,c:4,col:'b',up:true,nm:'\u99ac'},
  {r:5,c:6,col:'r',up:true,nm:'\u70ae'},
  {r:4,c:2,col:'b',up:true,nm:'\u76f8'}
];
var SEL={r:9,c:4};
var LMF={r:8,c:3},LMT={r:7,c:3};
var VM=[{r:8,c:4},{r:9,c:3},{r:9,c:5}];

function db(){
  var svg=gv('brd');
  var bc=gval('bc');
  var dm=gcb('dm');
  var lc=gval('lc');
  var lo=parseInt(gval('lo'))/100;
  var lt=parseFloat(gval('lt'))/10;
  var sf=gcb('sf');
  var fc=gval('fc');
  var fw=parseInt(gval('fw'));
  var rtOn=gcb('rt');
  var rtLtxt=gval('rtL');
  var rtRtxt=gval('rtR');
  var rc2=gval('rc2');
  var ro=parseInt(gval('ro'))/100;
  var rfs=parseInt(gval('rfs'));
  var rp1=gval('rp1'),rp2=gval('rp2'),rp3=gval('rp3'),rtc=gval('rtc');
  var bp1=gval('bp1'),bp2=gval('bp2'),bp3=gval('bp3'),btc=gval('btc');
  var irc=gval('irc');
  var iro=parseInt(gval('iro'))/100;
  var irt=parseFloat(gval('irt'))/10;
  var sr=gcb('sr');
  var rrc=gval('rrc'),brc=gval('brc');
  var rw=parseInt(gval('rw'));
  var qm=gcb('qm');
  var qc=gval('qc');
  var qo=parseInt(gval('qo'))/100;
  var lmOn=gcb('lm');
  var lmc=gval('lmc');
  var lmo=parseInt(gval('lmo'))/100;
  var vmOn=gcb('vm');
  var vmc=gval('vmc');
  var sgOn=gcb('sg');
  var sgc=gval('sgc');
  var sgo=parseInt(gval('sgo'))/100;
  var outerR=parseInt(gval('outerR'));
  var innerR=parseInt(gval('innerR'));
  var pb=gval('pb');

  var boardBg=dm?'#2c1810':bc;
  var lineCol=h2a(lc,lo);
  var riverCol=h2a(rc2,ro);
  var ircol=h2a(irc,iro);
  var qcol=h2a(qc,qo);
  var lmcol=h2a(lmc,lmo);
  var vmcol=h2a(vmc,0.6);
  var sgcol=h2a(sgc,sgo);

  var mainEl=gv('main');
  if(pb==='g')mainEl.style.background='#f0f0f0';
  else if(pb==='d')mainEl.style.background='#1a1a2e';
  else if(pb==='r')mainEl.style.background='radial-gradient(ellipse at center,#e8d5a3 0%,#b8860b 50%,#3d2b00 100%)';
  else if(pb==='b')mainEl.style.background='linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 40%,#81c784 100%)';
  else if(pb==='w')mainEl.style.background='#ffffff';

  var o='';
  o+='<defs>';
  o+='<radialGradient id="rg_r" cx="38%" cy="32%" r="65%">';
  o+='<stop offset="0%" stop-color="'+rp1+'"/>';
  o+='<stop offset="50%" stop-color="'+rp2+'"/>';
  o+='<stop offset="100%" stop-color="'+rp3+'"/>';
  o+='</radialGradient>';
  o+='<radialGradient id="rg_b" cx="38%" cy="32%" r="65%">';
  o+='<stop offset="0%" stop-color="'+bp1+'"/>';
  o+='<stop offset="50%" stop-color="'+bp2+'"/>';
  o+='<stop offset="100%" stop-color="'+bp3+'"/>';
  o+='</radialGradient>';
  o+='</defs>';

  o+='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="6" fill="'+boardBg+'"/>';

  if(sf){
    var fhalf=fw/2;
    var fx=PX-SZ/2+fhalf,fy=PY-SZ/2+fhalf;
    var fw2=(COLS-1)*SZ+SZ-fw,fh2=(ROWS-1)*SZ+SZ-fw;
    o+='<rect x="'+fx+'" y="'+fy+'" width="'+fw2+'" height="'+fh2+'" rx="4" fill="none" stroke="'+fc+'" stroke-width="'+fw+'"/>';
  }

  if(lmOn){
    var lmfx=px(LMF.c)-SZ/2,lmfy=py2(LMF.r)-SZ/2;
    var lmtx=px(LMT.c)-SZ/2,lmty=py2(LMT.r)-SZ/2;
    o+='<rect x="'+lmfx+'" y="'+lmfy+'" width="'+SZ+'" height="'+SZ+'" fill="'+lmcol+'" rx="3"/>';
    o+='<rect x="'+lmtx+'" y="'+lmty+'" width="'+SZ+'" height="'+SZ+'" fill="'+lmcol+'" rx="3"/>';
  }

  o+='<g stroke="'+lineCol+'" stroke-width="'+lt+'" stroke-linecap="round">';
  for(var r=0;r<ROWS;r++){
    o+='<line x1="'+px(0)+'" y1="'+py2(r)+'" x2="'+px(8)+'" y2="'+py2(r)+'"/>';
  }
  for(var c=0;c<COLS;c++){
    if(c===0||c===8){
      o+='<line x1="'+px(c)+'" y1="'+py2(0)+'" x2="'+px(c)+'" y2="'+py2(9)+'"/>';
    } else {
      o+='<line x1="'+px(c)+'" y1="'+py2(0)+'" x2="'+px(c)+'" y2="'+py2(4)+'"/>';
      o+='<line x1="'+px(c)+'" y1="'+py2(5)+'" x2="'+px(c)+'" y2="'+py2(9)+'"/>';
    }
  }
  var dx=SZ*0.5,dy=SZ*0.5;
  o+='<line x1="'+px(3)+'" y1="'+py2(0)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(0)+dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(0)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(0)+dy)+'"/>';
  o+='<line x1="'+px(3)+'" y1="'+py2(2)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(2)-dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(2)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(2)-dy)+'"/>';
  o+='<line x1="'+px(3)+'" y1="'+py2(7)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(7)+dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(7)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(7)+dy)+'"/>';
  o+='<line x1="'+px(3)+'" y1="'+py2(9)+'" x2="'+(px(3)+dx)+'" y2="'+(py2(9)-dy)+'"/>';
  o+='<line x1="'+px(5)+'" y1="'+py2(9)+'" x2="'+(px(5)-dx)+'" y2="'+(py2(9)-dy)+'"/>';
  o+='</g>';

  if(rtOn){
    var ry=(py2(4)+py2(5))/2;
    o+='<text x="'+(W/2-45)+'" y="'+ry+'" text-anchor="middle" dominant-baseline="middle"';
    o+=' font-size="'+rfs+'" fill="'+riverCol+'" font-family="serif" letter-spacing="6">'+rtLtxt+'</text>';
    o+='<text x="'+(W/2+45)+'" y="'+ry+'" text-anchor="middle" dominant-baseline="middle"';
    o+=' font-size="'+rfs+'" fill="'+riverCol+'" font-family="serif" letter-spacing="6">'+rtRtxt+'</text>';
  }

  if(vmOn){
    for(var i=0;i<VM.length;i++){
      o+='<circle cx="'+px(VM[i].c)+'" cy="'+py2(VM[i].r)+'" r="9" fill="'+vmcol+'"/>';
    }
  }

  for(var pi=0;pi<PIECES.length;pi++){
    var p=PIECES[pi];
    var cx=px(p.c),cy=py2(p.r);
    var isSel=(SEL&&SEL.r===p.r&&SEL.c===p.c);
    var grad=p.col==='r'?'url(#rg_r)':'url(#rg_b)';
    var rimCol=p.col==='r'?rrc:brc;
    var textCol=p.col==='r'?rtc:btc;

    if(sgOn&&isSel){
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(outerR+5)+'" fill="'+sgcol+'"/>';
    }
    if(sr&&!p.up){
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+outerR+'" fill="'+rimCol+'"/>';
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(outerR-rw)+'" fill="'+grad+'"/>';
    } else {
      o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+outerR+'" fill="'+grad+'"/>';
    }
    o+='<circle cx="'+cx+'" cy="'+cy+'" r="'+innerR+'" fill="none" stroke="'+ircol+'" stroke-width="'+irt+'"/>';
    if(p.up&&p.nm){
      o+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central"';
      o+=' font-size="'+(outerR*0.88)+'" font-family="serif" font-weight="bold" fill="'+textCol+'">';
      o+=p.nm+'</text>';
    } else if(!p.up&&qm){
      o+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central"';
      o+=' font-size="'+(outerR*0.75)+'" font-family="serif" fill="'+qcol+'">?</text>';
    }
  }

  svg.innerHTML=o;

  var lbl=gv('cl');
  var parts=[];
  if(sf)parts.push('Frame');
  if(dm)parts.push('Dark');
  if(sr)parts.push('Rim');
  if(lmOn)parts.push('LastMove');
  if(vmOn)parts.push('ValidMoves');
  if(sgOn)parts.push('Glow');
  lbl.textContent=parts.length?parts.join('+'):'Default';
}

function rst(){
  gv('bc').value='#f5deb3';gv('dm').checked=false;
  gv('lc').value='#8b5a2b';gv('lo').value=40;sv('lv','40%');
  gv('lt').value=10;sv('ltv','1.0px');
  gv('sf').checked=true;gv('fc').value='#8b6914';gv('fw').value=8;sv('fwv','8px');
  gv('rt').checked=true;gv('rtL').value='\u695a\u6cb3';gv('rtR').value='\u6f22\u754c';
  gv('rc2').value='#8b5a2b';gv('ro').value=40;sv('rov','40%');gv('rfs').value=13;sv('rfsv','13px');
  gv('rp1').value='#e8c060';gv('rp2').value='#a06828';gv('rp3').value='#3d2000';gv('rtc').value='#f8e17a';
  gv('bp1').value='#606060';gv('bp2').value='#282828';gv('bp3').value='#000000';gv('btc').value='#e0e0e0';
  gv('irc').value='#ffd700';gv('iro').value=55;sv('irov','55%');gv('irt').value=15;sv('irtv','1.5px');
  gv('sr').checked=true;gv('rrc').value='#c0392b';gv('brc').value='#222222';
  gv('rw').value=3;sv('rwv','3px');gv('qm').checked=true;gv('qc').value='#ffffff';gv('qo').value=65;sv('qov','65%');
  gv('lm').checked=true;gv('lmc').value='#ffd200';gv('lmo').value=32;sv('lmov','32%');
  gv('vm').checked=true;gv('vmc').value='#50c850';

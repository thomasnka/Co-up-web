<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoupPro Board Review</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:sans-serif;display:flex;height:100vh;overflow:hidden}
#sidebar{width:280px;min-width:280px;background:#1e1e2e;color:#cdd6f4;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#sidebar h1{font-size:14px;text-align:center;color:#cba6f7;padding:6px 0;border-bottom:1px solid #45475a;margin-bottom:4px}
.sec{background:#313244;border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.sec h2{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#89b4fa;margin-bottom:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
.row label{flex:1;color:#bac2de}
.row input[type=color]{width:36px;height:24px;border:none;border-radius:4px;cursor:pointer;background:none;padding:0}
.row input[type=range]{flex:1;accent-color:#89b4fa}
.row input[type=checkbox]{width:16px;height:16px;accent-color:#89b4fa;cursor:pointer}
.row span.val{width:36px;text-align:right;font-size:11px;color:#a6adc8}
.row select{flex:1;background:#45475a;color:#cdd6f4;border:none;border-radius:4px;padding:3px 4px;font-size:12px}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:7px 4px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s}
.btn-p{background:#89b4fa;color:#1e1e2e}
.btn-s{background:#45475a;color:#cdd6f4}
.btn:hover{opacity:.85}
#main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .3s}
#brd{display:block}
#bl{margin-top:10px;font-size:13px;color:#555}
</style>
</head>
<body>
<div id="sidebar">
  <h1>CoupPro Board Review</h1>

  <div class="sec">
    <h2>Board Background</h2>
    <div class="row"><label>Color</label><input type="color" id="bc" value="#f5deb3" oninput="db()"></div>
    <div class="row"><label>Wood Texture</label><input type="checkbox" id="wt" onchange="db()"></div>
    <div class="row"><label>Dark Mode</label><input type="checkbox" id="dm" onchange="db()"></div>
  </div>

  <div class="sec">
    <h2>Grid Lines</h2>
    <div class="row"><label>Color</label><input type="color" id="lc" value="#8b5a2b" oninput="db()"></div>
    <div class="row"><label>Opacity</label><input type="range" id="lo" min="10" max="100" value="40" oninput="sv('lv',this.value+'%');db()"><span class="val" id="lv">40%</span></div>
    <div class="row"><label>Thickness</label><input type="range" id="lt" min="5" max="25" value="10" oninput="sv('ltv',this.value/10+'px');db()"><span class="val" id="ltv">1.0px</span></div>
  </div>

  <div class="sec">
    <h2>Board Frame</h2>
    <div class="row"><label>Show Frame</label><input type="checkbox" id="sf" checked onchange="db()"></div>
    <div class="row"><label>Frame Color</label><input type="color" id="fc" value="#8b6914" oninput="db()"></div>
    <div class="row"><label>Frame Width</label><input type="range" id="fw" min="4" max="24" value="10" oninput="sv('fwv',this.value+'px');db()"><span class="val" id="fwv">10px</span></div>
  </div>

  <div class="sec">
    <h2>Hidden Pieces (Rim)</h2>
    <div class="row"><label>Side Color Rim</label><input type="checkbox" id="sr" checked onchange="db()"></div>
    <div class="row"><label>Red Rim Color</label><input type="color" id="rrc" value="#c0392b" oninput="db()"></div>
    <div class="row"><label>Black Rim Color</label><input type="color" id="brc" value="#222222" oninput="db()"></div>
    <div class="row"><label>Rim Width</label><input type="range" id="rw" min="2" max="10" value="4" oninput="sv('rwv',this.value+'px');db()"><span class="val" id="rwv">4px</span></div>
    <div class="row"><label>Show ? Mark</label><input type="checkbox" id="qm" checked onchange="db()"></div>
  </div>

  <div class="sec">
    <h2>Highlights</h2>
    <div class="row"><label>Last Move</label><input type="checkbox" id="lm" checked onchange="db()"></div>
    <div class="row"><label>Valid Moves</label><input type="checkbox" id="vm" checked onchange="db()"></div>
    <div class="row"><label>Selected Glow</label><input type="checkbox" id="sg" checked onchange="db()"></div>
  </div>

  <div class="sec">
    <h2>Piece Size</h2>
    <div class="row"><label>Outer Radius</label><input type="range" id="or" min="30" max="52" value="44" oninput="sv('orv',this.value);db()"><span class="val" id="orv">44</span></div>
    <div class="row"><label>Inner Radius</label><input type="range" id="ir" min="20" max="44" value="38" oninput="sv('irv',this.value);db()"><span class="val" id="irv">38</span></div>
  </div>

  <div class="sec">
    <h2>BG Style</h2>
    <div class="row"><label>Page BG</label>
      <select id="pb" onchange="db()">
        <option value="g">Gray (#f0f0f0)</option>
        <option value="d">Dark</option>
        <option value="r">Radial Gradient</option>
        <option value="b">Bamboo Atmosphere</option>
      </select>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn btn-p" onclick="rst()">Reset Default</button>
    <button class="btn btn-s" onclick="cpCfg()">Copy Config</button>
  </div>
</div>
<div id="main">
  <svg id="brd" xmlns="http://www.w3.org/2000/svg" width="500" height="556" style="border-radius:4px"></svg>
  <div id="bl">CoupPro Board Preview &mdash; <b id="cl" style="color:#e94560">Default (Current)</b></div>
</div>

<script>
var COLS=9,ROWS=10,SZ=50,PX=50,PY=53;
var W=500,H=556;

function gv(id){return document.getElementById(id)}
function sv(id,v){var el=gv(id);if(el)el.textContent=v;}

var PIECES=[
  {r:0,c:0,col:'b',up:false},{r:0,c:1,col:'b',up:false},{r:0,c:2,col:'b',up:false},
  {r:0,c:3,col:'b',up:false},{r:0,c:4,col:'b',up:true,nm:'\u5c06'},
  {r:0,c:5,col:'b',up:false},{r:0,c:6,col:'b',up:false},{r:0,c:7,col:'b',up:false},
  {r:0,c:8,col:'b',up:false},
  {r:9,c:0,col:'r',up:false},{r:9,c:1,col:'r',up:false},{r:9,c:2,col:'r',up:false},
  {r:9,c:3,col:'r',up:false},{r:9,c:4,col:'r',up:true,nm:'\u5e25'},
  {r:9,c:5,col:'r',up:false},{r:9,c:6,col:'r',up:false},{r:9,c:7,col:'r',up:false},
  {r:9,c:8,col:'r',up:false},
  {r:5,c:2,col:'r',up:true,nm:'\u8eca'},
  {r:4,c:4,col:'b',up:true,nm:'\u99ac'},
  {r:5,c:6,col:'r',up:true,nm:'\u70ae'},
  {r:4,c:2,col:'b',up:true,nm:'\u76f8'}
];
var SEL={r:9,c:4};
var LMF={r:8,c:3};
var LMT={r:7,c:3};
var VM=[{r:8,c:4},{r:9,c:3},{r:9,c:5}];

function px(c){return PX+c*SZ;}
function py(r){return PY+r*SZ;}

function h2a(hex,a){
  var r2=parseInt(hex.slice(1,3),16);
  var g2=parseInt(hex.slice(3,5),16);
  var b2=parseInt(hex.slice(5,7),16);
  return 'rgba('+r2+','+g2+','+b2+','+a+')';
}

function mkEl(tag,attrs,inner){
  var s='<'+tag;
  for(var k in attrs)s+=' '+k+'="'+attrs[k]+'"';
  if(inner!==undefined)s+='>'+inner+'</'+tag+'>';
  else s+='/>';
  return s;
}

function db(){
  var svg=gv('brd');
  var bc=gv('bc').value;
  var wt=gv('wt').checked;
  var dm=gv('dm').checked;
  var lc=gv('lc').value;
  var lo=parseInt(gv('lo').value)/100;
  var lt=parseFloat(gv('lt').value)/10;
  var sf=gv('sf').checked;
  var fc=gv('fc').value;
  var fw=parseInt(gv('fw').value);
  var sr=gv('sr').checked;
  var rrc=gv('rrc').value;
  var brc=gv('brc').value;
  var rw=parseInt(gv('rw').value);
  var qm=gv('qm').checked;
  var lmOn=gv('lm').checked;
  var vmOn=gv('vm').checked;
  var sgOn=gv('sg').checked;
  var outerR=parseInt(gv('or').value);
  var innerR=parseInt(gv('ir').value);
  var pb=gv('pb').value;

  var boardBg=dm?'#2c1810':(wt?'url(#wood)':bc);
  var lineCol=h2a(lc,lo);
  var mainEl=gv('main');
  if(pb==='g')mainEl.style.background='#f0f0f0';
  else if(pb==='d')mainEl.style.background='#1a1a2e';
  else if(pb==='r')mainEl.style.background='radial-gradient(ellipse at center,#d4a843 0%,#8b6914 60%,#3d2b00 100%)';
  else if(pb==='b')mainEl.style.background='linear-gradient(135deg,#e8f5e9 0%,#c8e6c9 30%,#a5d6a7 60%,#81c784 100%)';

  var out='';

  out+='<defs>';
  if(wt){
    out+='<filter id="wf"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>';
    out+='<feDiffuseLighting in="noise" lighting-color="'+bc+'" surfaceScale="2"><feDistantLight azimuth="45" elevation="60"/></feDiffuseLighting></filter>';
    out+='<rect id="wood" width="'+W+'" height="'+H+'" filter="url(#wf)"/>';
    out+='<pattern id="wood" x="0" y="0" width="'+W+'" height="'+H+'" patternUnits="userSpaceOnUse">';
    out+='<rect width="'+W+'" height="'+H+'" fill="'+bc+'"/>';
    out+='<rect width="'+W+'" height="'+H+'" fill="url(#wf)" opacity="0.3"/>';
    out+='</pattern>';
  }
  out+='<radialGradient id="rg_r" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#d4a843"/>';
  out+='<stop offset="60%" stop-color="#8b5a2b"/><stop offset="100%" stop-color="#3d2b00"/></radialGradient>';
  out+='<radialGradient id="rg_b" cx="40%" cy="35%" r="60%"><stop offset="0%" stop-color="#555"/>';
  out+='<stop offset="60%" stop-color="#222"/><stop offset="100%" stop-color="#000"/></radialGradient>';
  out+='</defs>';

  out+='<rect x="0" y="0" width="'+W+'" height="'+H+'" rx="6" ry="6" fill="'+boardBg+'"/>';

  if(sf){
    var fhalf=fw/2;
    out+='<rect x="'+(PX-25+fhalf)+'" y="'+(PY-25+fhalf)+'"';
    out+=' width="'+(8*SZ+50-fw)+'" height="'+(9*SZ+50-fw)+'"';
    out+=' rx="4" ry="4" fill="none" stroke="'+fc+'" stroke-width="'+fw+'"/>';
  }

  if(lmOn){
    out+='<rect x="'+(px(LMF.c)-SZ/2)+'" y="'+(py(LMF.r)-SZ/2)+'" width="'+SZ+'" height="'+SZ+'" fill="rgba(255,215,0,0.35)" rx="3"/>';
    out+='<rect x="'+(px(LMT.c)-SZ/2)+'" y="'+(py(LMT.r)-SZ/2)+'" width="'+SZ+'" height="'+SZ+'" fill="rgba(255,215,0,0.35)" rx="3"/>';
  }

  if(vmOn){
    for(var i=0;i<VM.length;i++){
      out+='<circle cx="'+px(VM[i].c)+'" cy="'+py(VM[i].r)+'" r="10" fill="rgba(100,200,100,0.55)"/>';
    }
  }

  out+='<g stroke="'+lineCol+'" stroke-width="'+lt+'">';
  for(var r=0;r<ROWS;r++){
    out+='<line x1="'+px(0)+'" y1="'+py(r)+'" x2="'+px(8)+'" y2="'+py(r)+'"/>';
  }
  for(var c=0;c<COLS;c++){
    if(c===0||c===8){
      out+='<line x1="'+px(c)+'" y1="'+py(0)+'" x2="'+px(c)+'" y2="'+py(9)+'"/>';
    } else {
      out+='<line x1="'+px(c)+'" y1="'+py(0)+'" x2="'+px(c)+'" y2="'+py(4)+'"/>';
      out+='<line x1="'+px(c)+'" y1="'+py(5)+'" x2="'+px(c)+'" y2="'+py(9)+'"/>';
    }
  }
  out+='<line x1="'+px(3)+'" y1="'+py(0)+'" x2="'+px(5)+'" y2="'+py(2)+'"/>';
  out+='<line x1="'+px(5)+'" y1="'+py(0)+'" x2="'+px(3)+'" y2="'+py(2)+'"/>';
  out+='<line x1="'+px(3)+'" y1="'+py(7)+'" x2="'+px(5)+'" y2="'+py(9)+'"/>';
  out+='<line x1="'+px(5)+'" y1="'+py(7)+'" x2="'+px(3)+'" y2="'+py(9)+'"/>';
  out+='</g>';

  var riverY=(py(4)+py(5))/2;
  out+='<text x="'+W/2+'" y="'+(riverY+5)+'" text-anchor="middle" dominant-baseline="middle"';
  out+=' font-size="15" fill="'+lineCol+'" font-family="serif" letter-spacing="40">楚河  漢界</text>';

  for(var pi=0;pi<PIECES.length;pi++){
    var p=PIECES[pi];
    var cx=px(p.c);
    var cy=py(p.r);
    var isSel=(SEL&&SEL.r===p.r&&SEL.c===p.c);
    var grad=p.col==='r'?'url(#rg_r)':'url(#rg_b)';
    var rimCol=p.col==='r'?rrc:brc;

    if(sgOn&&isSel){
      out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(outerR+4)+'" fill="rgba(255,255,100,0.4)" opacity="0.8"/>';
    }

    if(sr&&!p.up){
      out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+outerR+'" fill="'+rimCol+'" />';
      out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(outerR-rw)+'" fill="'+grad+'" />';
    } else {
      out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+outerR+'" fill="'+grad+'" />';
    }
    out+='<circle cx="'+cx+'" cy="'+cy+'" r="'+innerR+'" fill="none" stroke="rgba(255,215,0,0.5)" stroke-width="1.5"/>';

    if(p.up&&p.nm){
      var tcol=p.col==='r'?'#f8e17a':'#e8e8e8';
      out+='<text cx="'+cx+'" cy="'+cy+'" x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central"';
      out+=' font-size="22" font-family="serif" font-weight="bold" fill="'+tcol+'" stroke="rgba(0,0,0,0.3)" stroke-width="0.5">';
      out+=p.nm+'</text>';
    } else if(!p.up&&qm){
      out+='<text x="'+cx+'" y="'+cy+'" text-anchor="middle" dominant-baseline="central"';
      out+=' font-size="20" font-family="serif" fill="rgba(255,255,255,0.7)">?</text>';
    }
  }

  svg.innerHTML=out;

  var lbl=gv('cl');
  var parts=[];
  if(sf)parts.push('Frame');
  if(wt)parts.push('Wood');
  if(dm)parts.push('Dark');
  if(sr)parts.push('Rim');
  if(lmOn)parts.push('LastMove');
  lbl.textContent=parts.length?parts.join(' + '):'Default (Current)';
}

function rst(){
  gv('bc').value='#f5deb3';
  gv('wt').checked=false;
  gv('dm').checked=false;
  gv('lc').value='#8b5a2b';
  gv('lo').value=40;sv('lv','40%');
  gv('lt').value=10;sv('ltv','1.0px');
  gv('sf').checked=true;
  gv('fc').value='#8b6914';
  gv('fw').value=10;sv('fwv','10px');
  gv('sr').checked=true;
  gv('rrc').value='#c0392b';
  gv('brc').value='#222222';
  gv('rw').value=4;sv('rwv','4px');
  gv('qm').checked=true;
  gv('lm').checked=true;
  gv('vm').checked=true;
  gv('sg').checked=true;
  gv('or').value=44;sv('orv','44');
  gv('ir').value=38;sv('irv','38');
  gv('pb').value='g';
  db();
}

function cpCfg(){
  var cfg={
    boardColor:gv('bc').value,
    woodTexture:gv('wt').checked,
    darkMode:gv('dm').checked,
    lineColor:gv('lc').value,
    lineOpacity:parseInt(gv('lo').value),
    lineThickness:parseFloat(gv('lt').value)/10,
    showFrame:gv('sf').checked,
    frameColor:gv('fc').value,
    frameWidth:parseInt(gv('fw').value),
    sideRim:gv('sr').checked,
    redRimColor:gv('rrc').value,
    blackRimColor:gv('brc').value,
    rimWidth:parseInt(gv('rw').value),
    showQuestion:gv('qm').checked,
    lastMove:gv('lm').checked,
    validMoves:gv('vm').checked,
    selectedGlow:gv('sg').checked,
    outerRadius:parseInt(gv('or').value),
    innerRadius:parseInt(gv('ir').value),
    pageBg:gv('pb').value
  };
  navigator.clipboard.writeText(JSON.stringify(cfg,null,2)).then(function(){
    alert('Config copied to clipboard!');
  });
}

window.onload=function(){db();};
</script>
</body>
</html>
